<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#111418" />
<link rel="icon" href="data:," />
<title>Outbreak</title>
<style>
  html, body { margin: 0; height: 100%; background: #111418; overflow: hidden; overscroll-behavior: none;
    font-family: system-ui, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
  #game { position: fixed; inset: 0; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; top: env(safe-area-inset-top, 0); left: 0; right: 0; padding: 10px 14px; pointer-events: none;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; text-shadow: 0 1px 3px #000; }
  #timer { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #timer.low { color: #ff5a4d; }
  #task { font-size: 15px; text-align: right; max-width: 55%; line-height: 1.3; }
  #task small { opacity: .75; display: block; }
  #toast { position: fixed; top: 70px; left: 0; right: 0; text-align: center; font-weight: 600; pointer-events: none;
    text-shadow: 0 1px 3px #000; opacity: 0; transition: opacity .3s; }
  #toast.on { opacity: 1; }
  #arrow { position: fixed; top: 74px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; display: none;
    text-shadow: 0 1px 3px #000; font-size: 11px; }
  #arrow-icon { display: block; font-size: 22px; color: #f2c230; line-height: 1; }
  #hold { position: fixed; bottom: 18%; left: 50%; width: 120px; margin-left: -60px; height: 8px; border-radius: 4px;
    background: rgba(255,255,255,.2); display: none; pointer-events: none; }
  #hold-bar { height: 100%; width: 0; border-radius: 4px; background: #f2c230; }
  #stick { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.08); display: none; pointer-events: none; }
  #knob { position: absolute; left: 35px; top: 35px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.55); }
  #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column;
    gap: 10px; background: rgba(10,12,15,.78); text-align: center; padding: 20px; }
  #overlay h1 { margin: 0; font-size: 42px; }
  #overlay p { margin: 0; opacity: .85; }
  #overlay button { margin-top: 14px; font-size: 20px; padding: 12px 28px; border: 0; border-radius: 10px; background: #e8ecef; color: #111; font-weight: 700; }
  #debug { position: fixed; bottom: 4px; left: 6px; font: 11px monospace; color: #9f9; white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<div id="game"></div>
<div id="loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px">Loading...</div>
<div id="hud"><div id="timer">0:00</div><div id="task"></div></div>
<div id="toast"></div>
<div id="arrow"><span id="arrow-icon">&#9650;</span><small id="arrow-dist"></small></div>
<div id="hold"><div id="hold-bar"></div></div>
<div id="stick"><div id="knob"></div></div>
<div id="overlay"><h1 id="ov-title"></h1><p id="ov-text"></p><p id="ov-seed"></p><button id="ov-btn">Play again</button></div>
<pre id="debug"></pre>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
