<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#06080c" />
<link rel="icon" href="data:," />
<title>Outbreak</title>
<style>
  html, body { margin: 0; height: 100%; background: #06080c; overflow: hidden; overscroll-behavior: none;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #eee; user-select: none; -webkit-user-select: none; }
  #game { position: fixed; inset: 0; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }
  .layer { position: fixed; inset: 0; pointer-events: none; }
  #vignette { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,.55) 80%, rgba(0,0,0,.85) 100%); }
  #hurt { background: radial-gradient(ellipse at center, rgba(120,0,0,0) 35%, rgba(150,0,0,.6) 100%); opacity: 0; transition: opacity .25s; }
  .bar { position: fixed; left: 0; right: 0; height: 0; background: #000; transition: height .9s ease; pointer-events: none; z-index: 5; }
  #lb-top { top: 0; } #lb-bot { bottom: 0; }
  body.cinema .bar { height: 11vh; }
  body.cinema #subs { bottom: calc(13vh + env(safe-area-inset-bottom, 0px)); }
  body.cinema #hud, body.cinema #arrow, body.cinema #hold { opacity: 0; }

  #hud { position: fixed; top: env(safe-area-inset-top, 0); left: 0; right: 0; padding: 12px 14px; pointer-events: none;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; text-shadow: 0 1px 3px #000; transition: opacity .6s; z-index: 4; }
  #clock small { display: block; font-size: 10px; letter-spacing: .18em; opacity: .7; }
  #timer { font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  #timer.low { color: #ff4d3d; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  #task { font-size: 14px; text-align: right; max-width: 58%; line-height: 1.35; }
  #task small { opacity: .7; display: block; font-size: 12px; margin-top: 2px; }
  #mute { pointer-events: auto; margin-top: 6px; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.2); color: #ddd;
    border-radius: 6px; font-size: 12px; padding: 3px 8px; }

  #arrow { position: fixed; top: 84px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; display: none;
    text-shadow: 0 1px 3px #000; font-size: 11px; z-index: 4; transition: opacity .6s; }
  #arrow-icon { display: block; font-size: 22px; color: #f2b630; line-height: 1; }
  #hold { position: fixed; bottom: 26%; left: 50%; width: 120px; margin-left: -60px; height: 6px; border-radius: 3px;
    background: rgba(255,255,255,.18); display: none; pointer-events: none; z-index: 4; }
  #hold-bar { height: 100%; width: 0; border-radius: 3px; background: #f2b630; }

  #subs { position: fixed; left: 50%; bottom: calc(200px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(92vw, 640px);
    text-align: center; pointer-events: none; z-index: 6; opacity: 0; transition: opacity .3s; }
  #subs.on { opacity: 1; }
  #subs .who { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #f2b630; margin-bottom: 4px; }
  #subs .who.radio { color: #7fd38a; } #subs .who.narr { color: #9aa4b5; }
  #subs .text { font-size: 16px; line-height: 1.45; text-shadow: 0 1px 4px #000, 0 0 12px #000; }
  #subs .text.narr { font-style: italic; color: #d7dbe2; }
  #skip { position: fixed; right: 14px; top: calc(11vh - 40px); z-index: 7; display: none; pointer-events: auto; background: none;
    color: #aaa; border: 1px solid #555; border-radius: 6px; padding: 5px 12px; font-size: 13px; }
  #tap-catcher { position: fixed; inset: 0; z-index: 5; display: none; }

  #card { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none;
    opacity: 0; transition: opacity 1.2s; z-index: 6; text-align: center; }
  #card.on { opacity: 1; }
  #card h2 { margin: 0; font-size: 44px; letter-spacing: .35em; font-weight: 300; text-indent: .35em; }
  #card p { margin: 10px 0 0; font-size: 13px; letter-spacing: .25em; text-transform: uppercase; opacity: .7; }

  #toast { position: fixed; top: 120px; left: 0; right: 0; text-align: center; font-weight: 600; pointer-events: none; font-size: 14px;
    text-shadow: 0 1px 3px #000; opacity: 0; transition: opacity .3s; z-index: 4; }
  #toast.on { opacity: 1; }
  #stick { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; z-index: 4;
    border: 2px solid rgba(255,255,255,.3); background: rgba(255,255,255,.06); display: none; pointer-events: none; }
  #knob { position: absolute; left: 35px; top: 35px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.5); }

  .screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column;
    gap: 10px; text-align: center; padding: 24px; z-index: 8; }
  #title { background: radial-gradient(ellipse at center, rgba(40,10,10,.55), rgba(0,0,0,.92)); display: flex; }
  #title h1 { margin: 0; font-size: clamp(44px, 12vw, 88px); letter-spacing: .28em; text-indent: .28em; font-weight: 800; color: #e8e2d8;
    text-shadow: 0 0 30px rgba(180,20,20,.6); }
  #title p { margin: 0; opacity: .7; letter-spacing: .2em; text-transform: uppercase; font-size: 12px; }
  #title button, #ending button { margin-top: 18px; font-size: 18px; padding: 12px 30px; border: 1px solid #c9c2b5; border-radius: 4px;
    background: transparent; color: #eee; letter-spacing: .15em; text-transform: uppercase; }
  #title button:disabled { opacity: .4; }
  #title small { position: absolute; bottom: 14px; left: 0; right: 0; opacity: .4; font-size: 10px; }
  #ending { background: rgba(0,0,0,.72); }
  #ending h1 { margin: 0; font-size: clamp(34px, 9vw, 56px); letter-spacing: .3em; text-indent: .3em; font-weight: 300; }
  #ending h1.won { color: #9ee6a8; } #ending h1.lost { color: #ff6a5a; }
  #ending p { margin: 0; max-width: 560px; line-height: 1.55; opacity: .88; }
  #ending .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  #ending .seed { font-size: 11px; opacity: .45; margin-top: 6px; }
  /* vitals under the clock */
  #vitals { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
  #health { width: 120px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; }
  #health-bar { height: 100%; width: 100%; background: #d9443a; transition: width .2s; }
  #funds { font-size: 13px; font-weight: 600; color: #9ee6a8; }
  #car-health { font-size: 11px; opacity: .8; display: none; }
  /* minimap: top right, under the objective */
  #minimap { position: fixed; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 96px); width: 112px; height: 112px; z-index: 4;
    border-radius: 50%; pointer-events: auto; transition: opacity .6s; }
  body.cinema #minimap, body.cinema .pad { opacity: 0; pointer-events: none; }
  /* action buttons, bottom right */
  .pad { position: fixed; z-index: 4; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: #fff;
    background: rgba(20,22,26,.55); border: 2px solid rgba(255,255,255,.28); font-weight: 700; letter-spacing: .05em; pointer-events: auto;
    touch-action: none; transition: opacity .6s; text-align: center; line-height: 1.1; }
  .pad.down { background: rgba(255,255,255,.25); }
  #btn-fire { right: 22px; bottom: calc(env(safe-area-inset-bottom, 0px) + 34px); width: 88px; height: 88px; font-size: 14px; border-color: rgba(255,90,70,.7); }
  #btn-use { right: 124px; bottom: calc(env(safe-area-inset-bottom, 0px) + 40px); width: 72px; height: 72px; font-size: 11px; display: none; border-color: rgba(242,182,48,.8); }
  #btn-reload { right: 34px; bottom: calc(env(safe-area-inset-bottom, 0px) + 136px); width: 50px; height: 50px; font-size: 18px; }
  #btn-swap { right: 96px; bottom: calc(env(safe-area-inset-bottom, 0px) + 128px); width: 64px; height: 64px; font-size: 10px; flex-direction: column; }
  #btn-swap b { font-size: 13px; }
  @media (hover: hover) and (pointer: fine) { .pad { opacity: .75; } }
  /* the weapon store: a full page */
  #store { z-index: 9; background: radial-gradient(ellipse at top, #2a1714 0%, #0d0b0b 70%); justify-content: flex-start;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 0 0; overflow: hidden; }
  #store header { width: min(94vw, 560px); display: flex; justify-content: space-between; align-items: flex-end; }
  #store header small { display: block; font-size: 10px; letter-spacing: .3em; color: #ff6b5b; text-align: left; }
  #store h1 { margin: 2px 0 0; font-size: 22px; letter-spacing: .12em; color: #fff; text-align: left; }
  #store .cash { color: #9ee6a8; font-weight: 700; font-size: 22px; }
  #store-tabs { width: min(94vw, 560px); display: flex; gap: 6px; margin: 12px 0 4px; }
  #store-tabs button { flex: 1; padding: 9px 4px; border: 1px solid #4a3330; background: rgba(255,255,255,.04); color: #bbb;
    border-radius: 6px; font-size: 13px; font-weight: 600; }
  #store-tabs button.on { background: #ff4b3b; border-color: #ff4b3b; color: #fff; }
  #store-list { width: min(94vw, 560px); flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; text-align: left; padding-bottom: 8px; }
  #store-list h2 { font-size: 11px; letter-spacing: .25em; text-transform: uppercase; color: #ff8a7a; margin: 14px 2px 6px; }
  #store .card { display: flex; gap: 10px; align-items: center; padding: 10px; margin-bottom: 8px; border-radius: 8px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.07); }
  #store .card.held { border-color: #9ee6a8; }
  #store .card .art { width: 96px; flex: none; background: rgba(0,0,0,.35); border-radius: 6px; padding: 4px; }
  #store .card .art img { width: 100%; display: block; }
  #store .card .info { flex: 1; min-width: 0; }
  #store .card .info b { font-size: 15px; }
  #store small { display: block; opacity: .65; font-size: 11px; margin: 2px 0 4px; }
  #store .stat { display: flex; align-items: center; gap: 6px; font-size: 10px; color: #aaa; margin-top: 3px; }
  #store .stat span { width: 66px; flex: none; }
  #store .stat i { flex: 1; height: 5px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; }
  #store .stat b { display: block; height: 100%; background: linear-gradient(90deg, #ff6b4b, #ffc06b); }
  #store .act { flex: none; }
  #store .row { display: flex; align-items: center; gap: 10px; padding: 10px 6px; border-bottom: 1px solid rgba(255,255,255,.08); }
  #store .row > span:first-child { flex: 1; }
  #store .pips em { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-left: 4px; border: 1px solid #9ee6a8; }
  #store .pips em.on { background: #9ee6a8; }
  #store button.buy, #store button.equip { min-width: 78px; padding: 9px 10px; border-radius: 6px; border: 1px solid #9ee6a8;
    background: rgba(158,230,168,.08); color: #9ee6a8; font-weight: 700; font-size: 14px; }
  #store button.equip { border-color: #ffc06b; color: #ffc06b; background: rgba(255,192,107,.08); }
  #store button:disabled { border-color: #444; color: #666; background: none; }
  #store .note { opacity: .6; font-size: 12px; margin: 12px 4px; }
  #store footer { width: min(94vw, 560px); display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 12px); border-top: 1px solid rgba(255,255,255,.1); }
  #store-hand { font-size: 13px; opacity: .8; }
  #store .close { padding: 11px 22px; border: 1px solid #aaa; background: none; color: #ddd; border-radius: 6px; font-size: 14px; }
  /* the full map */
  #map-screen { background: rgba(4,6,9,.94); z-index: 9; gap: 6px; }
  #map-screen p { margin: 0; font-size: 12px; opacity: .6; }
  #debug { position: fixed; bottom: 4px; left: 6px; font: 11px monospace; color: #9f9; white-space: pre; pointer-events: none; z-index: 9; }
</style>
</head>
<body>
<div id="game"></div>
<div id="vignette" class="layer"></div>
<div id="hurt" class="layer"></div>
<div id="lb-top" class="bar"></div><div id="lb-bot" class="bar"></div>
<div id="hud">
  <div id="clock"><small>LAST EVAC IN</small><div id="timer">0:00</div>
    <div id="vitals"><div id="health"><div id="health-bar"></div></div><div id="funds">$0</div><div id="car-health"></div></div>
    <button id="mute">Sound: on</button></div>
  <div id="task"></div>
</div>
<div id="arrow"><span id="arrow-icon">&#9650;</span><small id="arrow-dist"></small></div>
<div id="hold"><div id="hold-bar"></div></div>
<div id="toast"></div>
<div id="card"><h2 id="card-title"></h2><p id="card-sub"></p></div>
<div id="subs"><div class="who" id="subs-who"></div><div class="text" id="subs-text"></div></div>
<div id="tap-catcher"></div>
<button id="skip">Skip &rsaquo;</button>
<div id="stick"><div id="knob"></div></div>
<canvas id="minimap"></canvas>
<div id="btn-fire" class="pad">FIRE</div>
<div id="btn-use" class="pad">USE</div>
<div id="btn-reload" class="pad">&#8635;</div>
<div id="btn-swap" class="pad"><b id="ammo">12/24</b><span id="weapon-name">Pistol</span></div>
<div id="store" class="screen">
  <header><div><small>Weapon store</small><h1 id="store-name">HALDEN ARMS</h1></div><div class="cash" id="store-cash"></div></header>
  <nav id="store-tabs"></nav>
  <div id="store-list"></div>
  <footer><span id="store-hand"></span><button class="close" id="store-close">Leave store</button></footer>
</div>
<div id="map-screen" class="screen"><canvas id="fullmap"></canvas><p>Tap anywhere or press M to close</p></div>
<div id="title" class="screen">
  <h1>OUTBREAK</h1>
  <p>Day one &middot; Port Halden</p>
  <button id="start" disabled>Loading&hellip;</button>
  <small>Sound on. Drag anywhere to move, buttons to fire and use. Keyboard: WASD, Space fire, E use, R reload, Q swap, M map.</small>
</div>
<div id="ending" class="screen">
  <h1 id="end-title"></h1>
  <p id="end-text"></p>
  <div class="row"><button id="retry">Try again</button><button id="new-night">New night</button></div>
  <div class="seed" id="end-seed"></div>
</div>
<pre id="debug"></pre>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
