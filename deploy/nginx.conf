# Outbreak: static hosting with nginx (e.g. on a Lighthouse / any Linux VPS).
# The game is a static site: there is no server code. What makes it load fast is compression and
# caching, set up below. Install as /etc/nginx/conf.d/outbreak.conf, set server_name and root,
# then `sudo nginx -t && sudo systemctl reload nginx`. See deploy/README.md.

server {
    listen 80;
    server_name outbreak.example.com;  # your domain (or the server's IP)
    root /var/www/outbreak;            # where dist/ is copied to
    index index.html;

    # compress everything text-like, and the 3D model (glb compresses well)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary application/octet-stream;
    # if your nginx has the brotli module, this is smaller still:
    # brotli on; brotli_comp_level 6; brotli_types text/css application/javascript application/json model/gltf-binary;

    types {
        model/gltf-binary glb;
    }

    # the HTML is tiny and must always be fresh, so a new build is picked up straight away
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite's build output: file names carry a content hash, so they can be cached forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # characters and skins keep their names between builds: cache a day, then revalidate (ETag)
    location /assets/characters/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
