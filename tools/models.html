<!doctype html>
<html><head><meta charset="utf-8"><title>Model showroom</title>
<style>html,body{margin:0;height:100%;background:#1b1f26;color:#ddd;font:13px system-ui;overflow:hidden}#ui{position:fixed;left:12px;top:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:90vw}button{background:#2b313b;color:#ddd;border:1px solid #445;border-radius:6px;padding:6px 10px}button.on{background:#4a6;color:#fff}input{height:30px}</style></head>
<body><div id="ui"></div><script type="module">
// Dev-only showroom: npm run dev, open /tools/models.html (?m=pistol&finish=8a2be2&night&az=0.6&el=0.3&paused)
import { AmbientLight, DirectionalLight, GridHelper, HemisphereLight, PerspectiveCamera, Scene, Vector3, WebGLRenderer, Mesh, MeshLambertMaterial, MeshBasicMaterial, Box3 } from 'three';
import { loadModels, modelGeometry, modelLights } from '/src/render/models.ts';
await loadModels('/assets/models/models.glb');
const q = new URLSearchParams(location.search);
const NAMES = ['sedan', 'pickup', 'van', 'bike', 'heli', 'pistol', 'shotgun', 'rifle', 'baton', 'bat', 'machete'];
let name = q.get('m') || 'sedan';
let finish = q.get('finish') ? parseInt(q.get('finish'), 16) : undefined;
const night = q.has('night');
const scene = new Scene();
if (night) { scene.add(new HemisphereLight(0x5a6c94, 0x262018, 3.8)); const moon = new DirectionalLight(0xa8bcff, 2.3); moon.position.set(-30, 60, 20); scene.add(moon); }
else { scene.add(new AmbientLight(0xffffff, 1.3)); const sun = new DirectionalLight(0xffffff, 2.4); sun.position.set(4, 8, 6); scene.add(sun); }
scene.add(new GridHelper(40, 40, 0x444444, 0x333333));
const mat = new MeshLambertMaterial({ vertexColors: true }), lit = new MeshBasicMaterial({ vertexColors: true });
let obj = null;
function show() {
  if (obj) scene.remove(obj);
  obj = new Mesh(modelGeometry(name, finish), mat);
  const l = modelLights(name); if (l) obj.add(new Mesh(l, lit));
  scene.add(obj);
  const b = new Box3().setFromObject(obj), s = b.getSize(new Vector3()), c = b.getCenter(new Vector3());
  const d = Math.max(s.x, s.y, s.z) * 1.35;
  cam.userData = { c, d };
  [...ui.querySelectorAll('button')].forEach(x => x.classList.toggle('on', x.textContent === name));
}
const ui = document.getElementById('ui');
for (const n of NAMES) { const b = document.createElement('button'); b.textContent = n; b.onclick = () => { name = n; show(); }; ui.appendChild(b); }
const pick = document.createElement('input'); pick.type = 'color'; pick.oninput = () => { finish = parseInt(pick.value.slice(1), 16); show(); }; ui.appendChild(pick);
const r = new WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.setPixelRatio(devicePixelRatio); document.body.appendChild(r.domElement);
const cam = new PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 200);
show();
let az = Number(q.get('az') ?? 0.7); const el = Number(q.get('el') ?? 0.32); const paused = q.has('paused');
function loop() {
  if (!paused) az += 0.004;
  const { c, d } = cam.userData;
  cam.position.set(c.x + Math.cos(az) * Math.cos(el) * d, c.y + Math.sin(el) * d, c.z + Math.sin(az) * Math.cos(el) * d); cam.lookAt(c);
  r.render(scene, cam); requestAnimationFrame(loop);
}
loop();
</script></body></html>
