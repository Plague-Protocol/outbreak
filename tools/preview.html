<!doctype html>
<html><head><meta charset="utf-8"><title>Character clip preview</title>
<style>html,body{margin:0;height:100%;background:#1b1f26;color:#ddd;font:12px system-ui}#labels div{position:fixed;transform:translate(-50%,0)}</style></head>
<body><div id="labels"></div><script type="module">
import { AmbientLight, DirectionalLight, GridHelper, OrthographicCamera, Scene, Vector3, WebGLRenderer, AnimationMixer, LoopRepeat, LoopOnce, SRGBColorSpace, TextureLoader, MeshLambertMaterial, Box3 } from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { clone } from 'three/examples/jsm/utils/SkeletonUtils.js';
const base = '/assets/characters/';
const gltf = await new GLTFLoader().loadAsync(base + 'character.glb');
const skin = new URLSearchParams(location.search).get('skin') || 'humanMaleA';
const map = await new TextureLoader().loadAsync(base + skin + '.png'); map.colorSpace = SRGBColorSpace;
const mat = new MeshLambertMaterial({ map });
const scene = new Scene(); scene.add(new AmbientLight(0xffffff, 1.5)); const sun = new DirectionalLight(0xffffff, 2); sun.position.set(3, 6, 5); scene.add(sun);
const h = new Box3().setFromObject(gltf.scene).getSize(new Vector3()).y; const sc = 1.8 / h;
const only = new URLSearchParams(location.search).get('clip');
const clips = gltf.animations.filter(c => !only || c.name === only);
const cols = Math.ceil(Math.sqrt(clips.length)); const mixers = []; const labels = [];
const t0 = Number(new URLSearchParams(location.search).get('t') || 0);
clips.forEach((c, i) => {
  const o = clone(gltf.scene); o.scale.setScalar(sc); o.traverse(m => { if (m.isSkinnedMesh) m.material = mat; });
  const x = (i % cols) * 2.2, z = Math.floor(i / cols) * 2.6; o.position.set(x, 0, z); scene.add(o);
  const mx = new AnimationMixer(o); const a = mx.clipAction(c); a.setLoop(LoopRepeat, Infinity); a.play(); mx.setTime(t0 * c.duration); mixers.push(mx);
  labels.push({ name: c.name, p: new Vector3(x, 2.05, z) });
});
scene.add(new GridHelper(40, 40, 0x444444, 0x333333));
const r = new WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.setPixelRatio(devicePixelRatio); document.body.appendChild(r.domElement);
const span = cols * 2.2; const cam = new OrthographicCamera(-span * 0.62, span * 0.62, span * 0.62 * innerHeight / innerWidth, -span * 0.62 * innerHeight / innerWidth, 0.1, 100);
const side = new URLSearchParams(location.search).get('side');
const ctr = new Vector3((cols - 1) * 1.1, 0.9, (Math.ceil(clips.length / cols) - 1) * 1.3);
cam.position.copy(ctr).add(side ? new Vector3(12, 1.5, 0) : new Vector3(0, 3, 12)); cam.lookAt(ctr);
const L = document.getElementById('labels'); labels.forEach(l => { const d = document.createElement('div'); d.textContent = l.name; L.appendChild(d); l.el = d; });
let last = performance.now(); const paused = new URLSearchParams(location.search).has('paused');
function loop(now) { const dt = (now - last) / 1000; last = now; if (!paused) mixers.forEach(m => m.update(dt)); r.render(scene, cam);
  labels.forEach(l => { const v = l.p.clone().project(cam); l.el.style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; l.el.style.top = ((1 - v.y) / 2 * innerHeight) + 'px'; }); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script></body></html>
